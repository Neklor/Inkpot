# Flatpak-Manifest für Inkpot.
#
# Diese Datei ist zugleich die Datei, die bei Flathub eingereicht wird: ein
# Pull Request an github.com/flathub/flathub, Zweig new-pr, der genau sie im
# Wurzelverzeichnis hinzufügt. Der Name muss der Anwendungs-ID entsprechen.
#
# Lokal bauen und ausprobieren:
#   flatpak install flathub org.kde.Platform//6.11 org.kde.Sdk//6.11
#   flatpak-builder --user --install --force-clean build-flatpak \
#       flatpak/io.github.neklor.Inkpot.yml
#   flatpak run io.github.neklor.Inkpot

id: io.github.neklor.Inkpot
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: inkpot

finish-args:
  # Fenster und Grafik
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Bilder und Projektdateien. Alles Übrige läuft über den Dateiportal-Dialog,
  # den Qt in einer Sandbox von sich aus verwendet; dafür braucht es keine
  # weitere Berechtigung.
  - --filesystem=xdg-pictures
  - --filesystem=xdg-documents

  # Drucken
  - --socket=cups

modules:
  - name: inkpot
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: git
        url: https://github.com/Neklor/Inkpot.git
        tag: v1.0.0
        commit: a9c5e98ee9cdbb0c628a9d29f06696e6d5b95135

      # Zum Bauen aus dem Arbeitsverzeichnis stattdessen:
      # - type: dir
      #   path: ..
